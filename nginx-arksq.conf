# arskq.cn — brand landing page + /ark/ SPA app + API proxy

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arskq.cn www.arskq.cn;

    ssl_certificate /etc/letsencrypt/live/arskq.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arskq.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # API 反向代理 → Node.js 后端
    location /api/ {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /ark/ SPA 应用 — root 指向 dist 目录的父级
    location /ark/ {
        root /var/www/html;
        try_files $uri $uri/ /ark/index.html;

        # 动态 chunk 走 immutable 长缓存
        location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # index.html 入口强制不缓存，确保用户每次拿到最新构建入口
    location = /ark/index.html {
        root /var/www/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 根域名品牌页
    location / {
        root /var/www/arksq;
        index index.html;
        try_files $uri /index.html;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name arskq.cn www.arskq.cn;

    location / {
        return 301 https://$host$request_uri;
    }
}
