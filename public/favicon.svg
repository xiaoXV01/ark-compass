<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8"/>
      <stop offset="100%" style="stop-color:#FF8C42"/>
    </linearGradient>
  </defs>
  <!-- 罗盘主体 -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#g)" stroke-width="5"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- 十字方向 -->
  <line x1="50" y1="8" x2="50" y2="92" stroke="#00B4D8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="50" x2="92" y2="50" stroke="#00B4D8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 对角线 -->
  <line x1="20" y1="20" x2="80" y2="80" stroke="#FF8C42" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="20" x2="20" y2="80" stroke="#FF8C42" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 罗盘指针N/S -->
  <polygon points="50,12 46,38 54,38" fill="#00B4D8"/>
  <polygon points="50,88 46,62 54,62" fill="#FF8C42"/>
  <!-- 中心点 -->
  <circle cx="50" cy="50" r="5" fill="url(#g)"/>
  <!-- 齿轮装饰 -->
  <g transform="translate(14,14)" opacity="0.3">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#B8860B" stroke-width="1.5"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#B8860B" stroke-width="1.5"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#B8860B" stroke-width="1.5"/>
  </g>
  <g transform="translate(72,72)" opacity="0.3">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#B8860B" stroke-width="1.5"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#B8860B" stroke-width="1.5"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#B8860B" stroke-width="1.5"/>
  </g>
</svg>
